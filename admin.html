<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CleanLaundry</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased pb-20">

    <!-- NAVBAR ADMIN -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <span class="text-base font-black text-blue-400">ADMIN<span class="text-white">PANEL</span></span>
            <a href="index.html" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg">← Ke Website Customer</a>
        </div>
    </nav>

    <main class="max-w-md mx-auto px-4 py-6 space-y-6">

        <!-- RINGKASAN STATUS & PESANAN MASUK -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-sm text-white">📦 Kelola Status Pesanan Aktif</h2>
                <button onclick="exportReport()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg transition">
                    📥 Ekspor Laporan
                </button>
            </div>

            <div id="activeOrderCard" class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-xs space-y-2">
                <!-- Data pesanan dimuat via JS -->
            </div>
        </div>

        <!-- TAMBAH LAYANAN & HARGA BARU -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <h2 class="font-bold text-sm text-white">🏷️ Tambah Layanan & Harga</h2>
            <form onsubmit="addService(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nama Layanan</label>
                    <input type="text" id="serviceName" placeholder="Contoh: Cuci Karpet / m2" required class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Harga (Rp)</label>
                    <input type="number" id="servicePrice" placeholder="15000" required class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                    + Simpan Layanan Baru
                </button>
            </form>
        </div>

        <!-- DAFTAR LAYANAN TERSEDIA -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3">
            <h2 class="font-bold text-sm text-white">📋 Daftar Layanan Saat Ini</h2>
            <ul id="serviceList" class="space-y-2 text-xs text-slate-300">
                <!-- Daftar layanan dimuat via JS -->
            </ul>
        </div>

    </main>

    <!-- LOGIKA DAN INTEGRASI SCRIPT -->
    <script>
        // Load Order Aktif
        function loadAdminOrder() {
            const card = document.getElementById('activeOrderCard');
            const savedOrder = JSON.parse(localStorage.getItem('laundry_active_order'));

            if (!savedOrder) {
                card.innerHTML = `<p class="text-slate-500 text-center py-2">Belum ada pesanan aktif dari pelanggan.</p>`;
                return;
            }

            card.innerHTML = `
                <div class="flex justify-between font-bold text-blue-400 border-b border-slate-800 pb-2">
                    <span>${savedOrder.service}</span>
                    <span class="text-slate-400">${savedOrder.date}</span>
                </div>
                <p><span class="text-slate-500">Slot Jam:</span> ${savedOrder.slot}</p>
                <div class="mt-3">
                    <label class="block text-[10px] text-slate-400 mb-1">Update Progress Pelanggan (Real-time):</label>
                    <select id="updateStatusSelect" onchange="updateStatus(this.value)" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white outline-none">
                        <option value="Penjemputan" ${savedOrder.status === 'Penjemputan' ? 'selected' : ''}>Penjemputan Kurir</option>
                        <option value="Dicuci" ${savedOrder.status === 'Dicuci' ? 'selected' : ''}>Proses Dicuci & Pengeringan</option>
                        <option value="Disetrika" ${savedOrder.status === 'Disetrika' ? 'selected' : ''}>Proses Disetrika</option>
                        <option value="Pengantaran" ${savedOrder.status === 'Pengantaran' ? 'selected' : ''}>Dalam Pengantaran Kembali</option>
                        <option value="Selesai" ${savedOrder.status === 'Selesai' ? 'selected' : ''}>Selesai / Diterima</option>
                    </select>
                </div>
            `;
        }

        // Update Status Pesanan
        function updateStatus(newStatus) {
            let savedOrder = JSON.parse(localStorage.getItem('laundry_active_order'));
            if (savedOrder) {
                savedOrder.status = newStatus;
                localStorage.setItem('laundry_active_order', JSON.stringify(savedOrder));
                alert('Status pesanan berhasil diperbarui ke: ' + newStatus);
            }
        }

        // Tambah Layanan Baru
        function addService(e) {
            e.preventDefault();
            const name = document.getElementById('serviceName').value;
            const price = document.getElementById('servicePrice').value;

            let services = JSON.parse(localStorage.getItem('laundry_services')) || [];
            services.push({ name, price: Number(price) });
            localStorage.setItem('laundry_services', JSON.stringify(services));

            alert('Layanan baru berhasil ditambahkan!');
            e.target.reset();
            renderServices();
        }

        // Render Daftar Layanan
        function renderServices() {
            const list = document.getElementById('serviceList');
            let services = JSON.parse(localStorage.getItem('laundry_services')) || [
                { name: 'Cuci Kiloan Reguler', price: 7000 },
                { name: 'Cuci Setrika Kilat', price: 10000 },
                { name: 'Cuci Selimut / Bedcover', price: 20000 }
            ];

            list.innerHTML = services.map(s => `
                <li class="flex justify-between items-center bg-slate-950 px-3 py-2 rounded-xl border border-slate-800">
                    <span>${s.name}</span>
                    <span class="font-bold text-blue-400">Rp ${s.price.toLocaleString('id-ID')}</span>
                </li>
            `).join('');
        }

        // Ekspor Laporan Sederhana (.CSV)
        function exportReport() {
            const savedOrder = JSON.parse(localStorage.getItem('laundry_active_order'));
            if (!savedOrder) {
                alert('Tidak ada data pesanan untuk diekspor!');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Layanan,Tanggal,Slot Jam,Status\n";
            csvContent += `"${savedOrder.service}","${savedOrder.date}","${savedOrder.slot}","${savedOrder.status}"\n`;

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Laporan_Laundry_Clean.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = () => {
            loadAdminOrder();
            renderServices();
        };
    </script>
</body>
</html>
