<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natuna Laundry - Layanan Cuci Kilat & Bersih</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased pb-20">

    <!-- NAVBAR MOBILE-FIRST -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <span class="text-lg font-black text-blue-400">CLEAN<span class="text-white">LAUNDRY</span></span>
            <div class="flex items-center gap-2 text-xs">
                <a href="#order" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-lg font-bold">Pesan</a>
                <a href="auth.html" id="navAccountBtn" class="bg-slate-800 text-slate-300 px-2.5 py-1.5 rounded-lg font-semibold hover:bg-slate-700">Akun / Masuk</a>
                <a href="admin.html" class="bg-slate-800 text-slate-400 px-2.5 py-1.5 rounded-lg hover:text-white">Admin</a>
            </div>
        </div>
    </nav>

    <!-- HEADER & STATUS TRACKING -->
    <header class="max-w-md mx-auto px-4 py-6">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-5 rounded-2xl shadow-lg mb-6">
            <h1 class="text-xl font-black mb-1">Cucian Bersih Tanpa Ribet!</h1>
            <p class="text-blue-100 text-xs">Jadwalkan penjemputan pakaian Anda sekarang juga.</p>
        </div>

        <!-- Real-time Order Tracking Visual (Progress Bar Dinamis) -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Status Pesanan Aktif</h2>
            <div class="flex justify-between text-xs font-semibold mb-2">
                <span id="labelStep1" class="text-blue-400">Penjemputan</span>
                <span id="labelStep2" class="text-slate-400">Proses Cuci</span>
                <span id="labelStep3" class="text-slate-400">Selesai</span>
            </div>
            <!-- Progress Bar dengan ID -->
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="progressBarFill" class="bg-blue-500 h-full w-1/3 rounded-full transition-all duration-500"></div>
            </div>
            <p id="statusText" class="text-[11px] text-slate-400 mt-2">Belum ada pesanan aktif.</p>
        </div>
    </header>

    <!-- FORM PENJADWALAN & PEMBAYARAN -->
    <main id="order" class="max-w-md mx-auto px-4">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <h2 class="font-bold text-base text-white">Buat Pesanan Baru</h2>
            
            <form onsubmit="submitOrder(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Pilih Layanan</label>
                    <select id="serviceType" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white outline-none">
                        <option value="Cuci Kiloan Reguler - Rp 7.000/kg">Cuci Kiloan Reguler (Rp 7.000/kg)</option>
                        <option value="Cuci Setrika Kilat - Rp 10.000/kg">Cuci Setrika Kilat (Rp 10.000/kg)</option>
                        <option value="Cuci Selimut/Bedcover - Rp 20.000">Cuci Selimut / Bedcover (Rp 20.000)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tanggal Penjemputan</label>
                    <input type="date" id="pickupDate" required class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white outline-none">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Slot Waktu Operasional (08.00 - 17.00)</label>
                    <select id="pickupSlot" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white outline-none">
                        <option value="Sesi Pagi (08:00 - 11:00)">Sesi Pagi (08:00 - 11:00)</option>
                        <option value="Sesi Siang (13:00 - 15:00)">Sesi Siang (13:00 - 15:00)</option>
                        <option value="Sesi Sore (15:00 - 17:00)">Sesi Sore (15:00 - 17:00)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Metode Pembayaran</label>
                    <select id="paymentMethod" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white outline-none">
                        <option value="COD (Bayar saat pakaian diantar)">COD (Bayar saat pakaian diantar)</option>
                        <option value="Transfer Bank (BCA / Mandiri)">Transfer Bank (BCA / Mandiri)</option>
                        <option value="QRIS / E-Wallet (GoPay, DANA, OVO)">QRIS / E-Wallet (GoPay, DANA, OVO)</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition mt-2">
                    Konfirmasi Pesanan & Bayar
                </button>
            </form>
        </div>
    </main>

    <!-- SCRIPT UTAMA DENGAN REAL-TIME POLLING SYNC -->
    <script>
        // Fungsi untuk memperbarui tampilan status & progress bar
        function checkAndUpdateStatus() {
            let savedOrder = JSON.parse(localStorage.getItem('laundry_active_order'));
            let statusText = document.getElementById('statusText');
            let progressBar = document.getElementById('progressBarFill');

            if (savedOrder && statusText && progressBar) {
                statusText.innerText = "Status: " + savedOrder.status + " | Bayar via: " + savedOrder.payment;

                // Logika Pergerakan Progress Bar & Warna Label
                let lbl1 = document.getElementById('labelStep1');
                let lbl2 = document.getElementById('labelStep2');
                let lbl3 = document.getElementById('labelStep3');

                if (savedOrder.status === 'Penjemputan Kurir') {
                    progressBar.style.width = '33%';
                    lbl1.className = "text-blue-400 font-bold";
                    lbl2.className = "text-slate-400";
                    lbl3.className = "text-slate-400";
                } else if (savedOrder.status === 'Proses Dicuci' || savedOrder.status === 'Proses Disetrika') {
                    progressBar.style.width = '66%';
                    lbl1.className = "text-slate-400";
                    lbl2.className = "text-blue-400 font-bold";
                    lbl3.className = "text-slate-400";
                } else if (savedOrder.status === 'Selesai / Dikirim') {
                    progressBar.style.width = '100%';
                    lbl1.className = "text-slate-400";
                    lbl2.className = "text-slate-400";
                    lbl3.className = "text-emerald-400 font-bold";
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Cek Login User di Navbar
            let currentUser = JSON.parse(localStorage.getItem('laundry_current_user'));
            if (currentUser && currentUser.name) {
                let btnAccount = document.getElementById('navAccountBtn');
                if (btnAccount) {
                    btnAccount.innerText = "👤 " + currentUser.name.split(' ')[0];
                    btnAccount.className = "bg-emerald-900/50 text-emerald-300 border border-emerald-700/50 px-2.5 py-1.5 rounded-lg font-semibold text-xs";
                }
            }

            // Jalankan pengecekan status pertama kali saat halaman dibuka
            checkAndUpdateStatus();

            // SINKRONISASI REAL-TIME: Cek perubahan data setiap 1 detik secara otomatis tanpa perlu refresh
            setInterval(checkAndUpdateStatus, 1000);
        });

        function submitOrder(e) {
            e.preventDefault();
            let service = document.getElementById('serviceType').value;
            let date = document.getElementById('pickupDate').value;
            let slot = document.getElementById('pickupSlot').value;
            let payment = document.getElementById('paymentMethod').value;

            let orderData = { 
                service, 
                date, 
                slot, 
                payment, 
                status: 'Penjemputan Kurir' 
            };
            
            localStorage.setItem('laundry_active_order', JSON.stringify(orderData));
            alert('Pesanan berhasil dibuat! Pembayaran via ' + payment);
            location.reload();
        }
    </script>
</body>
</html>
